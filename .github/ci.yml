# CI. Every step below is a `make` target, so these are the same strings a contributor
# runs locally (P4-D6.2) and `make ci` is this whole file in one command.
#
# If this file is at .github/workflows/ci.yml, CI is active. If it is at .github/ci.yml
# instead, that is because the identity pushing it lacks the GitHub App `workflows`
# permission - GitHub rejects any push that creates a file under .github/workflows/
# without it. To activate:
#
#     git mv .github/ci.yml .github/workflows/ci.yml && git push
#
# Nothing here is required to develop against the bridge: the regression suite drives a
# mock Studio peer over real HTTP, the Luau checks use the analyzer committed under
# roblox-bridge/tools/, and no job needs a Studio install or a network service. The only
# pip install in the file is ruff, which is a lint-time dependency - the bridge runtime
# stays stdlib-only (AGENTS.md rule 1), and the audit below enforces that.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-suite:
    name: Bridge suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version this release was developed and verified on; 3.10 is the
        # floor the docs promise and `zip(..., strict=)` needs.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore the analyzer's exec bit (lost on some checkouts)
        run: bash roblox-bridge/tools/fix-perms.sh

      - name: Regression suite
        run: make test

      - name: No third-party imports
        # AGENTS.md rule 1: the bridge ships as stdlib-only Python. Anything new in the
        # runtime modules must be in the standard library or in this repo.
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          root = pathlib.Path("roblox-bridge")
          local = {p.stem for p in root.glob("*.py")}
          stdlib = set(sys.stdlib_module_names)

          def guarded(tree):
              """Line numbers inside a `try:` body - an optional dependency with a
              documented fallback (AGENTS.md) is allowed, an unconditional import is not."""
              lines = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Try):
                      for stmt in node.body:
                          for inner in ast.walk(stmt):
                              if hasattr(inner, "lineno"):
                                  lines.add(inner.lineno)
              return lines

          offenders = []
          for path in sorted(root.glob("*.py")):
              allowed = local | stdlib
              if path.name == "setup.py" or path.name.startswith("test_"):
                  allowed |= {"ast", "unittest"}
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              skip = guarded(tree)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [] if node.level else [(node.module or "").split(".")[0]]
                  else:
                      continue
                  if node.lineno in skip:
                      continue
                  for name in names:
                      if name and name not in allowed:
                          offenders.append(f"{path.name}:{node.lineno} imports {name!r}")
          if offenders:
              print("\n".join(sorted(set(offenders))))
              sys.exit("runtime modules must stay stdlib-only (see AGENTS.md rule 1)")
          print("stdlib-only: clean")
          PY

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-py${{ matrix.python-version }}
          path: |
            roblox-bridge/bridge_state
          if-no-files-found: ignore

  lint:
    name: Lint (ruff + blind-except ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Lint-time only. pyproject.toml documents the two ignored rules; BLE001 is
        # ratcheted against tools/lint_ble_baseline.txt so the count can only go down.
        run: python3 -m pip install --upgrade ruff

      - name: Lint gate
        run: make lint

  studio-plugin:
    name: Studio plugin pre-flight (Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the analyzer's exec bit
        run: bash roblox-bridge/tools/fix-perms.sh

      - name: Undefined-global scan (bridge, kit modules, kit systems)
        run: make luau

      - name: ArenaBridge.lua through the bridge's own pre-flight
        working-directory: roblox-bridge
        run: >
          python3 -B -m unittest
          test_bridge_mcp.TestHashAndToolchain.test_arena_bridge_lua_passes_luau_check
          test_bridge_mcp.TestHashAndToolchain.test_every_self_stamped_module_agrees_on_the_version

  kit-and-docs:
    name: Asset kit, generated facts and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Licence manifest for the bundled kit assets
        run: make verify

      - name: Committed asset manifest matches the tree
        run: make kit

      - name: Docs agree with the tree
        # docs/FACTS.md is generated (tools/emit_facts.py). This replaces the inline
        # version guard, which was blind to CONNECT.md's phrasing - and whose heredoc was
        # indented so badly that this file did not parse as YAML at all.
        run: make docs-check

      - name: No credential, state file or private key is tracked
        run: make secrets

  dashboard:
    name: Dashboard contract (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: XSS/CSP contract, action delegation and token-free URLs
        run: make harness
